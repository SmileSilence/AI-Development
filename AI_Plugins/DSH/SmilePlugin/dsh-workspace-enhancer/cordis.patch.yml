# smilexx-workspace-enhancer bundle patch
#
# 注册 sidebar.workspaces（工作区侧栏）后备界面：
#   - 禁用官方 ui-workspace（其 client 半部注册 sidebar.workspaces）
#   - insert 本插件的 Host + Client 半部；其它工作区插件仍可按优先级接管侧栏
#
# disabled 对不存在的 entry 幂等无害；对存在的 entry 停用。insert 由
# dsh plugin --profile <name> add 触发，也可手动加入 cordis.patch.yml。
- id: ui-workspace
  disabled: true
- insert:
    - id: workspace-enhancer
      name: smilexx-workspace-enhancer
      config:
        # 集成自 dsh-workspace-tagger 的标签子系统开关（默认开）。
        tags:
          enabled: true
