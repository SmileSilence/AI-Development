name: <skill-name>
description: <技能描述>
# 技能元数据
metadata:
  version: "v1"
  publisher: "SmileXX"
  category: <分类>
  platforms: ["OpenAI/Codex", "DSH", "Claude"]
  keywords: [keyword1, keyword2]

# 界面配置
interface:
  display_name: "<显示名称>"
  short_description: "<简短描述>"
  default_prompt: |
    <默认提示词>
    # 技能名称: <技能名称>
    # 功能: <核心功能描述>
    # 使用场景: <主要使用场景>
  hidden: false  # 是否在界面中隐藏，true为隐藏，false为显示

# 调用配置
invocation: auto  # auto（自动触发）或 explicit（显式调用）

# 权限配置（可选）
permissions:
  - file_system: read_write  # 文件系统权限
  - network: read           # 网络访问权限
  - process: execute        # 进程执行权限

# 工具配置（可选）
tools:
  - name: file_system
    access: read_write
  - name: web_search
    access: read

# 环境变量配置（可选）
environment:
  - name: SKILL_DEBUG
    default: "false"
    description: "启用调试模式"
  - name: SKILL_PATH
    default: "."
    description: "技能资源路径"

# 钩子配置（可选）
hooks:
  pre_invoke: |
    # 调用前执行的命令或脚本
    echo "Starting skill: <skill-name>"
  post_invoke: |
    # 调用后执行的命令或脚本  
    echo "Skill completed: <skill-name>"

# 兼容性配置
compatibility:
  openai_api_version: ">=1.0.0"
  codex_version: ">=2.0.0"
  agents_md_spec: ">=0.8.0"
