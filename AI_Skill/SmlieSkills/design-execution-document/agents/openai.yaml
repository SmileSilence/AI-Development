name: design-execution-document
description: 创建包含设计和执行部分的综合文档，确保文档完整可执行
interface:
  display_name: "设计+执行文档创建"
  short_description: "创建设计+执行综合文档"
  default_prompt: "您需要创建一个包含设计和执行部分的综合文档。请先分析用户需求，识别已安装的插件（如dsh插件开发相关插件），确保设计文档满足其要求。然后查找相关官方文档作为主要参考资料，如果需要参考文档或源码，请下载相关文档或源码，将解析后的内容写入文档并标明出处，同时将原始文档与设计文档放在同一目录中以便快速参照。接着创建详细的设计文档，包括需求分析、系统架构设计、功能模块设计等。然后根据设计文档创建可执行的执行部分，包括安装部署指南、配置说明、操作步骤等。最后将两部分整合为完整文档，并提供优化建议和漏洞检查。请确保文档内容完整、准确、可执行，优先使用官方文档作为参考资料，无需查看除官方文档以外的其他资料即可根据文档执行任务。"
  hidden: false
invocation: auto